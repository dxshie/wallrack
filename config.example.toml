# wallrack — full example config with all defaults spelled out.
# Copy to ~/.config/wallrack/config.toml and adjust for your setup.
# First run also writes a minimal default config to that path automatically.

# ─── apply hooks ──────────────────────────────────────────────────────────────
# Shell commands executed around every successful `wallrack apply`.
# Both run blocking in sh -c; a non-zero exit prints a warning but does not
# fail the apply itself. pre_apply_hook fires before the backend apply_cmd,
# post_apply_hook fires after.
#
# Available environment variables:
#   WALLRACK_WALLPAPER    image path (wallpaper / we_image) or WE project
#                         folder path (we)
#   WALLRACK_MONITOR      monitor name as returned by monitors_cmd
#   WALLRACK_INTEGRATION  one of: wallpaper  we_image  we
#
# The post_apply_hook below mirrors the theming logic that used to live in the
# picker scripts:
#   wallpaper / we_image  run matugen on the image
#   we                    extract the project.json preview path and run
#                         matugen on that image
#
# Tip: for more complex workflows point a hook at an external script instead:
#   post_apply_hook = "~/.config/wallrack/post-apply.sh"

[hooks]
pre_apply_hook = ""
post_apply_hook = """
if command -v matugen >/dev/null 2>&1; then
    if [ "$WALLRACK_INTEGRATION" = "we" ]; then
        preview=$(jq -r '.preview // ""' "$WALLRACK_WALLPAPER/project.json" 2>/dev/null)
        if [ -n "$preview" ] && [ -f "$WALLRACK_WALLPAPER/$preview" ]; then
            matugen image "$WALLRACK_WALLPAPER/$preview" \
                --source-color-index 0 \
                --lightness-dark 0.0 \
                --lightness-light 0.0 \
                -t scheme-content
        fi
    else
        matugen image "$WALLRACK_WALLPAPER" \
            --source-color-index 0 \
            --lightness-dark 0.0 \
            --lightness-light 0.0 \
            -t scheme-content

    fi
fi
"""

# ─── thumbnails ───────────────────────────────────────────────────────────────

[thumbnails]
# Side length in pixels of the generated thumbnail images.
size = 256

# ─── wallpaper integration ────────────────────────────────────────────────────
# Plain images from user-defined directories.

[wallpaper]
# One or more directories to scan recursively for image files.
dirs = ["~/Pictures"]

[wallpaper.backend]
# Set the wallpaper on a specific monitor.
apply_cmd         = 'awww img "{{image}}" --transition-type center -o "{{monitor}}"'
# List available monitors, one name per line.
monitors_cmd      = "hyprctl monitors | awk '/^Monitor / {print $2}'"
# Optional. Print currently active wallpapers as <monitor>\t<path> lines.
# Powers the thumbnail shown next to each monitor in the monitor picker.
# Remove or comment out to disable that feature.
current_image_cmd = "awww query | sed -nE 's/^[ :]*([^:]+):.*image: (.+)$/\\1\\t\\2/p'"

# ─── wallpaper engine image integration ───────────────────────────────────────
# Extracts still images from Wallpaper Engine workshop projects and applies
# them like normal wallpapers. Uses the same apply/monitors backend as the
# wallpaper integration above.

[wallpaper_engine_image]
# Workshop directory to scan. Defaults to wallpaper_engine.workshop_dir when
# not set — typical setups share the same Steam workshop content folder.
# workshop_dir = "~/.local/share/Steam/steamapps/workshop/content/431960"

[wallpaper_engine_image.backend]
apply_cmd         = 'awww img "{{image}}" --transition-type center -o "{{monitor}}"'
monitors_cmd      = "hyprctl monitors | awk '/^Monitor / {print $2}'"
current_image_cmd = "awww query | sed -nE 's/^[ :]*([^:]+):.*image: (.+)$/\\1\\t\\2/p'"

# ─── booru integration ───────────────────────────────────────────────────────
# Search danbooru-style image boards (konachan, yandere, danbooru, gelbooru,
# safebooru come built-in) and download picks into download_dir. `wallrack
# booru search ...` caches the current page as the booru integration's
# "index" — `wallrack list --integration=booru` then renders it; `wallrack
# booru download <id>` (or `apply --integration=booru`) downloads it.

[booru]
# Where downloaded full-size images land. Point this at one of your
# `wallpaper.dirs` if you want booru downloads to show up in the wallpaper
# picker after a re-index.
download_dir = "~/Pictures/booru"
# Site key used when `--site` is omitted.
default_site = "konachan"
# Results per `booru search` page. Most boorus cap at ~100.
per_page = 20
# Per-request timeout for booru search API calls (seconds). The picker stalls
# on rofi for the full duration when a site is slow — pick a value short enough
# to notice the retry, long enough that healthy queries succeed.
request_timeout_secs = 30
# Retry attempts after a transient failure (timeout / connect error / HTTP 5xx
# / 429). 0 disables retries. 4xx other than 429 are never retried — those mean
# bad query or bad auth and will fail the same way each time.
max_retries = 2
# Initial backoff between retries (ms). Doubled per attempt, capped at 30s.
retry_backoff_ms = 500

# Add a custom site or override a built-in one. api_kind is one of:
#   moebooru  — konachan, yande.re
#   danbooru  — danbooru.donmai.us
#   gelbooru  — gelbooru.com, safebooru.org
#
# Authentication is per-family. Once logged in, the booru's API honors the
# content filter (rating threshold, blacklist) saved on your account profile,
# so logging in is the way to get NSFW posts past the default-anonymous
# "safe-only" view on sites that have one.
#
# Override a built-in site to add credentials — unspecified fields fall back
# to the builtin (so you don't need to re-state base_url or password_salt).
#
# ─ Moebooru (konachan, yande.re) ────────────────────────────────────────────
# Auth: login + password (or pre-hashed password_hash).
# [booru.sites.konachan]
# login    = "your-username"
# password = "your-password"
# # password_salt is built-in for konachan/yande.re. For a self-hosted
# # moebooru instance, set it to whatever the site's source uses:
# # password_salt = "your-site-salt--{}--"
# #
# # Alternative — paste the hash from your browser's cookies and skip storing
# # the plaintext password in config.toml:
# # password_hash = "40-char-hex-sha1"
#
# ─ Danbooru ─────────────────────────────────────────────────────────────────
# Auth: login + api_key (from your account → API Key page).
# [booru.sites.danbooru]
# login   = "your-login"
# api_key = "your-api-key"
#
# ─ Gelbooru ─────────────────────────────────────────────────────────────────
# Auth: user_id (numeric) + api_key. Find both on the My Account page.
# [booru.sites.gelbooru]
# user_id = "123456"
# api_key = "your-api-key"

# ─── wallpaper engine integration ─────────────────────────────────────────────
# Live Wallpaper Engine projects applied via linux-wallpaperengine.

[wallpaper_engine]
workshop_dir = "~/.local/share/Steam/steamapps/workshop/content/431960"

[wallpaper_engine.backend]
# linux-wallpaperengine is launched detached via setsid. Any previously
# running instance is killed and waited for before this command is spawned,
# so the template only needs to launch the new one.
apply_cmd    = 'uwsm app -- linux-wallpaperengine --screenshot-delay 1000 --screenshot ~/.cache/lock.jpg --autoplay-policy=no-user-gesture-required --no-audio-processing --disable-parallax --silent --no-fullscreen-pause --scaling fill --screen-root "{{monitor}}" --bg "{{workshop_id}}"'
monitors_cmd = "hyprctl monitors | awk '/^Monitor / {print $2}'"
# current_image_cmd is not used for the we integration — wallrack tracks
# per-monitor WE state internally.
