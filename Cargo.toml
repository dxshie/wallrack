[package]
name = "wallrack"
version = "0.2.1"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
anyhow = "1"
thiserror = "2"
dirs = "6"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
# Direct dep so we can use scale-on-decode (1/8, 1/4, 1/2) — the image crate's
# JpegDecoder wrapper doesn't expose it. rayon disabled: outer par_iter across
# images already saturates cores; per-image parallelism would just add overhead.
jpeg-decoder = { version = "0.3", default-features = false }
notify = "8"
notify-debouncer-full = "0.7"
nix = { version = "0.31", features = ["signal", "process"] }
rayon = "1.10"
sha2 = "0.11"
# Moebooru (konachan/yande.re) require login via SHA1(salt-template + password).
# The salt template is site-specific and the API rejects the raw password.
sha1 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
# Blocking HTTP for the booru integration. rustls-tls avoids dragging OpenSSL
# into the build; json enables the serde_json integration on Response.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "gzip"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
